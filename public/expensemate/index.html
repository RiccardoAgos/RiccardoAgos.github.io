<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#211044">
  <title>Scarica ExpenseMate</title>
  <meta name="description" content="Tutte le tue spese. Una sola app. Scarica ExpenseMate per iPhone e Android.">
  <link rel="canonical" href="https://riccardoagos.github.io/expensemate/">
  <link rel="icon" href="./icon.png">
  <meta property="og:title" content="ExpenseMate — Tutte le tue spese. Una sola app.">
  <meta property="og:description" content="Scarica ExpenseMate su App Store e Google Play.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://riccardoagos.github.io/expensemate/">
  <meta property="og:image" content="https://riccardoagos.github.io/expensemate/icon.png">
  <style>
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #211044; color-scheme: dark; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 40px 22px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #fff; background: radial-gradient(ellipse at 50% 38%, #7947cd80, transparent 62%), linear-gradient(155deg, #211044, #482080 65%, #271047); }
    main { width: 100%; max-width: 520px; text-align: center; }
    .tagline { margin: 0 0 36px; font-size: clamp(30px, 7.6vw, 44px); line-height: 1.15; font-weight: 750; letter-spacing: -.045em; }
    .tagline span { color: #d7baff; }
    .icon { display: block; width: 158px; height: 158px; object-fit: cover; margin: 0 auto; border-radius: 34px; box-shadow: 0 18px 60px #10042055; }
    h1 { margin: 18px 0 34px; font-size: 34px; font-weight: 700; letter-spacing: -.04em; }
    .stores { display: flex; justify-content: center; align-items: center; gap: 14px; flex-wrap: wrap; }
    .store { display: flex; align-items: center; justify-content: center; width: 174px; min-height: 60px; border-radius: 12px; background: #000; border: 1px solid #ffffff50; transition: transform .15s; }
    .store:hover { transform: translateY(-2px); }
    .store:focus-visible { outline: 3px solid #ddc7ff; outline-offset: 5px; }
    .store img { display: block; width: 148px; height: auto; }
    .store.play img { width: 172px; }
    #status { min-height: 42px; max-width: 310px; margin: 25px auto 0; color: #e3d5f5; font-size: 14px; line-height: 1.5; }
    @media (max-width: 380px) { .stores { gap: 12px; } .store { width: 150px; } .store img { width: 134px; } .store.play img { width: 148px; } }
    @media (prefers-reduced-motion: reduce) { .store { transition: none; } }
  </style>
</head>
<body>
  <main>
    <p class="tagline">Tutte le tue spese.<br><span>Una sola app.</span></p>
    <img class="icon" src="./icon.png" alt="Icona di ExpenseMate" width="158" height="158">
    <h1>ExpenseMate</h1>
    <div class="stores" aria-label="Scarica l’app">
      <a class="store" id="app-store" href="https://apps.apple.com/app/id6792808041" aria-label="Scarica ExpenseMate su App Store"><img src="../store-badges/app-store-it.svg" alt="Scarica su App Store"></a>
      <a class="store play" id="google-play" href="https://play.google.com/store/apps/details?id=com.riccardoagostini.expensemate" aria-label="Scarica ExpenseMate su Google Play"><img src="../store-badges/google-play-it.png" alt="Disponibile su Google Play"></a>
    </div>
    <p id="status" role="status"></p>
  </main>
  <script>
    (() => {
      // ?choose=1 always shows both stores, including on a phone.
      if (new URLSearchParams(location.search).get('choose') === '1') return;
      const ua = navigator.userAgent || '';
      const platform = navigator.userAgentData?.platform || navigator.platform || '';
      const android = /Android/i.test(ua) || /Android/i.test(platform);
      const ios = /iPhone|iPad|iPod/i.test(ua) || (/Mac/i.test(platform) && navigator.maxTouchPoints > 1);
      const store = android ? document.getElementById('google-play') : ios ? document.getElementById('app-store') : null;
      if (!store) return;
      document.getElementById('status').textContent = 'Apertura dello store… Se non si apre, tocca il pulsante qui sopra.';
      try { location.replace(store.href); } catch { /* Store buttons remain available. */ }
    })();
  </script>
</body>
</html>
